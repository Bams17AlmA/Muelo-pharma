version: '3.8'

services:
  # Base de données PostgreSQL transactionnelle (Schéma OLTP)
  postgres:
    image: postgres:16-alpine
    container_name: muelo_pharm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: muelo_user
      POSTGRES_PASSWORD: muelo_secure_password_2026
      POSTGRES_DB: muelo_pharm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muelo_user -d muelo_pharm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application Web Frontend (PWA React + Vite)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muelo_pharm_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
