name: Muelo PHARM CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types & Lint
        run: npm run lint

      - name: Run Business Logic & Offline Sync Tests
        run: npm run test

      - name: Build PWA Web Application
        run: npm run build

  deploy-pilot:
    name: Deploy Pilot (Push to main only)
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report deployment readiness
        run: |
          echo "Build successful. Deployment target ready for Render / Railway / Vercel."
